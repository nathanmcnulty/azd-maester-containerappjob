name: Validate solutions

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

env:
  POWERSHELL_TELEMETRY_OPTOUT: 1
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  AZURE_CORE_COLLECT_TELEMETRY: 0
  BICEP_CLI_TELEMETRY_OPTOUT: 1

permissions:
  contents: read

concurrency:
  group: validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install test dependencies
        run: |
          if ($PSVersionTable.PSVersion -lt [version]'7.6') { throw 'PowerShell 7.6 or newer is required.' }
          Write-Host "Validation PowerShell: $($PSVersionTable.PSVersion)"
          Install-Module Pester -RequiredVersion 6.2.0 -Scope CurrentUser -Force
      - name: Install pinned Bicep compiler for compiled infrastructure tests
        run: |
          az bicep install --version v0.42.1
          if ($LASTEXITCODE -ne 0) { throw 'Bicep installation failed.' }
          "BICEP_CLI_PATH=$HOME/.azure/bin/bicep" >> $env:GITHUB_ENV
      - name: Run repository tests
        run: |
          Import-Module Pester -RequiredVersion 6.2.0 -Force
          Write-Host "Validation Pester: $((Get-Module Pester).Version)"
          Invoke-Pester -Path ./tests -CI
      - name: Exercise bootstrap failure boundaries
        shell: bash
        run: python3 -m unittest discover -s tests -p 'test_*.py'
      - name: Parse PowerShell
        run: |
          $errors = @()
          Get-ChildItem -Path . -Recurse -File -Include *.ps1,*.psm1 | ForEach-Object {
            $tokens = $null
            $fileErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$fileErrors) | Out-Null
            $errors += @($fileErrors)
          }
          if ($errors.Count) { throw ($errors | Out-String) }
  container-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build the production image
        run: docker build --platform linux/amd64 --tag maester-runtime:validation .
      - name: Verify the image runtime and locked modules
        run: >-
          docker run --rm --network none --env POWERSHELL_TELEMETRY_OPTOUT=1 --env DOTNET_CLI_TELEMETRY_OPTOUT=1
          --mount type=bind,source="${{ github.workspace }}/scripts/Test-ContainerRuntime.ps1",target=/tmp/Test-ContainerRuntime.ps1,readonly
          maester-runtime:validation pwsh -NoLogo -NoProfile -File /tmp/Test-ContainerRuntime.ps1

      - name: Qualify actual Maester 2.3.0 results and strict gates offline
        run: >-
          docker run --rm --network none --env POWERSHELL_TELEMETRY_OPTOUT=1 --env DOTNET_CLI_TELEMETRY_OPTOUT=1
          --mount type=bind,source="${{ github.workspace }}",target=/repo,readonly
          maester-runtime:validation pwsh -NoLogo -NoProfile -File /repo/tests/Invoke-Maester230Compatibility.ps1

      - name: Qualify the unchanged approved drift suite against Maester 2.3.0
        run: >-
          docker run --rm --network none --env POWERSHELL_TELEMETRY_OPTOUT=1 --env DOTNET_CLI_TELEMETRY_OPTOUT=1
          --mount type=bind,source="${{ github.workspace }}",target=/repo,readonly
          maester-runtime:validation pwsh -NoLogo -NoProfile -File /repo/tests/Invoke-Maester230DriftCompatibility.ps1

      - name: Verify the mounted ACR production invocation offline
        shell: pwsh
        run: |
          Import-Module ./scripts/Maester-RuntimeFiles.psm1
          $staging = New-MaesterRuntimeStaging -IncludeACR
          try {
            docker run --rm --network none --env POWERSHELL_TELEMETRY_OPTOUT=1 --env DOTNET_CLI_TELEMETRY_OPTOUT=1 --mount "type=bind,source=$($staging.Path),target=/mnt/scripts,readonly" maester-runtime:validation /bin/sh /mnt/scripts/Start-MaesterContainerJob.sh acr -ValidateRuntimeOnly
            if ($LASTEXITCODE -ne 0) { throw 'Mounted ACR runtime validation failed.' }
          }
          finally { Remove-Item -LiteralPath $staging.Path -Recurse -Force }

  nonacr-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Run the production non-ACR bootstrap and locked imports
        shell: pwsh
        run: ./scripts/Test-NonAcrContainerRuntime.ps1
