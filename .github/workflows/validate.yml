name: Validate solutions

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Select PowerShell 7.6.6
        shell: bash
        run: |
          set -euo pipefail
          runtime="$RUNNER_TEMP/powershell-7.6.6"
          archive="$RUNNER_TEMP/powershell-7.6.6-linux-x64.tar.gz"
          mkdir "$runtime"
          curl --fail --location --output "$archive" 'https://github.com/PowerShell/PowerShell/releases/download/v7.6.6/powershell-7.6.6-linux-x64.tar.gz'
          echo "ddbc4a2d113bbd46d283cfedcbcd117a70caefd7673f41f2b4e0000badf103bc  $archive" | sha256sum --check
          tar -xzf "$archive" -C "$runtime"
          chmod +x "$runtime/pwsh"
          echo "$runtime" >> "$GITHUB_PATH"
      - name: Assert selected PowerShell runtime
        run: |
          if ($PSVersionTable.PSVersion -ne [version]'7.6.6' -or -not [Environment]::Is64BitProcess) {
            throw "Expected 64-bit PowerShell 7.6.6; observed $($PSVersionTable.PSVersion)."
          }
      - name: Install test dependencies
        run: Install-Module Pester -RequiredVersion 5.7.1 -Scope CurrentUser -Force
      - name: Prepare exact Maester viewer template fixture
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/maester-2.2.0.nupkg"
          assets="$RUNNER_TEMP/maester-viewer-assets"
          curl --fail --location --output "$archive" 'https://www.powershellgallery.com/api/v2/package/Maester/2.2.0'
          echo "8c8a9757771177bd89785262e6b38385cf5e5c19bb799e4399e77f6439ad699c  $archive" | sha256sum --check
          mkdir "$assets"
          unzip -q "$archive" assets/ReportTemplate.html -d "$assets"
          echo "a7b8dae3d5932c3096fa98709aaab9e9c1ebbfb83b5519e524b734ec751e3416  $assets/assets/ReportTemplate.html" | sha256sum --check
          echo "MAESTER_VIEWER_TEMPLATE_PATH=$assets/assets/ReportTemplate.html" >> "$GITHUB_ENV"
      - name: Install pinned Caddy validation binary
        shell: bash
        run: |
          set -euo pipefail
          runtime="$RUNNER_TEMP/caddy-2.11.7"
          archive="$RUNNER_TEMP/caddy-2.11.7-linux-amd64.tar.gz"
          mkdir "$runtime"
          curl --fail --location --output "$archive" 'https://github.com/caddyserver/caddy/releases/download/v2.11.7/caddy_2.11.7_linux_amd64.tar.gz'
          echo "727b91701a392de6ebc5027509f548bf39979e5216340d0faed8fa5e69c84f8b  $archive" | sha256sum --check
          tar -xzf "$archive" -C "$runtime" caddy
          chmod +x "$runtime/caddy"
          echo "$runtime" >> "$GITHUB_PATH"
      - name: Run repository tests
        run: Invoke-Pester -Path ./tests -CI
      - name: Validate real Caddy and worker boundary
        run: |
          $caddy = (Get-Command caddy -CommandType Application).Source
          if ((& $caddy version) -notmatch '^v2\.11\.7 ') { throw 'Unexpected Caddy version.' }
          & $caddy validate --config ./viewer/Caddyfile --adapter caddyfile
          if ($LASTEXITCODE) { throw 'Caddy configuration is invalid.' }
          & ./tests/Test-ProxyHeaders.ps1 -CaddyPath $caddy -ConfigPath ./viewer/Caddyfile -OutputDirectory (Join-Path $env:RUNNER_TEMP 'viewer-header-proof')
          & ./tests/Test-ViewerProxy.ps1 -Root $PWD.Path -CaddyPath $caddy -ConfigPath ./viewer/Caddyfile -OutputDirectory (Join-Path $env:RUNNER_TEMP 'viewer-proxy-proof')
      - name: Parse PowerShell
        run: |
          $errors = @()
          Get-ChildItem -Path . -Recurse -File -Include *.ps1,*.psm1 | ForEach-Object {
            $tokens = $null
            $fileErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$fileErrors) | Out-Null
            $errors += @($fileErrors)
          }
          if ($errors.Count) { throw ($errors | Out-String) }

  viewer-image:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Select PowerShell 7.6.6
        shell: bash
        run: |
          set -euo pipefail
          runtime="$RUNNER_TEMP/powershell-7.6.6"
          archive="$RUNNER_TEMP/powershell-7.6.6-linux-x64.tar.gz"
          mkdir "$runtime"
          curl --fail --location --output "$archive" 'https://github.com/PowerShell/PowerShell/releases/download/v7.6.6/powershell-7.6.6-linux-x64.tar.gz'
          echo "ddbc4a2d113bbd46d283cfedcbcd117a70caefd7673f41f2b4e0000badf103bc  $archive" | sha256sum --check
          tar -xzf "$archive" -C "$runtime"
          chmod +x "$runtime/pwsh"
          echo "$runtime" >> "$GITHUB_PATH"
      - name: Build viewer images
        shell: bash
        run: |
          set -euo pipefail
          test "$(pwsh -NoLogo -NoProfile -Command '$PSVersionTable.PSVersion.ToString()')" = '7.6.6'
          docker build --platform linux/amd64 --target worker --file viewer/Dockerfile --tag maester-viewer-worker:ci .
          docker build --platform linux/amd64 --target caddy --file viewer/Dockerfile --tag maester-viewer-caddy:ci .
      - name: Smoke viewer images
        run: ./tests/Test-ViewerImage.ps1 -WorkerImage maester-viewer-worker:ci -CaddyImage maester-viewer-caddy:ci -OutputDirectory (Join-Path $env:RUNNER_TEMP 'viewer-image-proof')
      - name: Upload viewer image proof
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: viewer-image-proof
          path: ${{ runner.temp }}/viewer-image-proof
          if-no-files-found: warn
          retention-days: 5
